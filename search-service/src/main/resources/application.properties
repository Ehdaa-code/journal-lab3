quarkus.http.port=8085

quarkus.datasource.db-kind=mysql
quarkus.datasource.reactive.url=${QUARKUS_DATASOURCE_REACTIVE_URL:mysql://localhost:3306/patient_db}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:root}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:root}

quarkus.log.level=INFO
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
mp.jwt.verify.issuer=${JWT_ISSUER_URI:http://localhost:8090/realms/journal-realm}
mp.jwt.verify.publickey.location=${JWT_JWK_SET_URI:http://localhost:8090/realms/journal-realm/protocol/openid-connect/certs}
smallrye.jwt.path.groups=realm_access/roles
