  verify-image-service:
    name: Verify image-service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: image-service
        run: npm install

      - name: Smoke check image-service
        working-directory: image-service
        run: node -e "console.log('image-service dependencies OK')"

  verify-frontend:
    name: Verify frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
