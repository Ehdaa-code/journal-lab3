name: Lab3 CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lab3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-user-service:
    name: Build and test user-service
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Create user_db
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS user_db;"

      - name: Run tests
        working-directory: user-service
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn clean test

      - name: Build package
        working-directory: user-service
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn clean package -DskipTests

  build-and-test-patient-service:
    name: Build and test patient-service
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Create patient_db
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS patient_db;"

      - name: Run tests
        working-directory: patient-service
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/patient_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn clean test

      - name: Build package
        working-directory: patient-service
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/patient_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn clean package -DskipTests

  build-and-test-message-service:
    name: Build and test message-service
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Create message_db
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS message_db;"

      - name: Run tests
        working-directory: message-service
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/message_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn clean test

      - name: Build package
        working-directory: message-service
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/message_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn clean package -DskipTests

  build-and-test-search-service:
    name: Build and test search-service
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Create patient_db for search
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS patient_db;"

      - name: Run tests
        working-directory: search-service
        env:
          QUARKUS_DATASOURCE_REACTIVE_URL: mysql://127.0.0.1:3306/patient_db
          QUARKUS_DATASOURCE_USERNAME: root
          QUARKUS_DATASOURCE_PASSWORD: root
        run: mvn clean test

      - name: Build package
        working-directory: search-service
        env:
          QUARKUS_DATASOURCE_REACTIVE_URL: mysql://127.0.0.1:3306/patient_db
          QUARKUS_DATASOURCE_USERNAME: root
          QUARKUS_DATASOURCE_PASSWORD: root
        run: mvn clean package -DskipTests

  verify-image-service:
    name: Verify image-service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: image-service
        run: npm install

      - name: Smoke check image-service
        working-directory: image-service
        run: node -e "console.log('image-service dependencies OK')"

  verify-frontend:
    name: Verify frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_USER_SERVICE_URL: https://journal-user1.app.cloud.cbh.kth.se
          REACT_APP_PATIENT_SERVICE_URL: https://journal-patient1.app.cloud.cbh.kth.se
          REACT_APP_MESSAGE_SERVICE_URL: https://journal-message1.app.cloud.cbh.kth.se
          REACT_APP_IMAGE_SERVICE_URL: https://journal-image1.app.cloud.cbh.kth.se
          REACT_APP_SEARCH_SERVICE_URL: https://journal-search1.app.cloud.cbh.kth.se
          REACT_APP_KEYCLOAK_URL: https://journal-keycloak1.app.cloud.cbh.kth.se
          REACT_APP_KEYCLOAK_REALM: journal-realm
          REACT_APP_KEYCLOAK_CLIENT_ID: journal-frontend
        run: npm run build

  build-docker-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs:
      - build-and-test-user-service
      - build-and-test-patient-service
      - build-and-test-message-service
      - build-and-test-search-service
      - verify-image-service
      - verify-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build user-service image
        run: docker build -t user-service:ci ./user-service

      - name: Build patient-service image
        run: docker build -t patient-service:ci ./patient-service

      - name: Build message-service image
        run: docker build -t message-service:ci ./message-service

      - name: Build search-service image
        run: docker build -t search-service:ci ./search-service

      - name: Build image-service image
        run: docker build -t image-service:ci ./image-service

      - name: Build frontend image
        run: |
          docker build \
            --build-arg REACT_APP_USER_SERVICE_URL=https://journal-user1.app.cloud.cbh.kth.se \
            --build-arg REACT_APP_PATIENT_SERVICE_URL=https://journal-patient1.app.cloud.cbh.kth.se \
            --build-arg REACT_APP_MESSAGE_SERVICE_URL=https://journal-message1.app.cloud.cbh.kth.se \
            --build-arg REACT_APP_IMAGE_SERVICE_URL=https://journal-image1.app.cloud.cbh.kth.se \
            --build-arg REACT_APP_SEARCH_SERVICE_URL=https://journal-search1.app.cloud.cbh.kth.se \
            --build-arg REACT_APP_KEYCLOAK_URL=https://journal-keycloak1.app.cloud.cbh.kth.se \
            --build-arg REACT_APP_KEYCLOAK_REALM=journal-realm \
            --build-arg REACT_APP_KEYCLOAK_CLIENT_ID=journal-frontend \
            -t journal-frontend2:ci ./frontend

      - name: Show built images
        run: docker images

  push-docker-images-to-cbhcloud:
    name: Push Docker images to cbhcloud
    runs-on: ubuntu-latest
    needs:
      - build-docker-images

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to cbhcloud registry
        uses: docker/login-action@v3
        with:
          registry: registry.cloud.cbh.kth.se
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push journal-user1
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: registry.cloud.cbh.kth.se/deploy/journal-user1:latest

      - name: Build and push journal-patient1
        uses: docker/build-push-action@v5
        with:
          context: ./patient-service
          push: true
          tags: registry.cloud.cbh.kth.se/deploy/journal-patient1:latest

      - name: Build and push journal-message1
        uses: docker/build-push-action@v5
        with:
          context: ./message-service
          push: true
          tags: registry.cloud.cbh.kth.se/deploy/journal-message1:latest

      - name: Build and push journal-search1
        uses: docker/build-push-action@v5
        with:
          context: ./search-service
          push: true
          tags: registry.cloud.cbh.kth.se/deploy/journal-search1:latest

      - name: Build and push journal-image1
        uses: docker/build-push-action@v5
        with:
          context: ./image-service
          push: true
          tags: registry.cloud.cbh.kth.se/deploy/journal-image1:latest

      - name: Build and push journal-frontend2
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: registry.cloud.cbh.kth.se/deploy/journal-frontend2:latest
          build-args: |
            REACT_APP_USER_SERVICE_URL=https://journal-user1.app.cloud.cbh.kth.se
            REACT_APP_PATIENT_SERVICE_URL=https://journal-patient1.app.cloud.cbh.kth.se
            REACT_APP_MESSAGE_SERVICE_URL=https://journal-message1.app.cloud.cbh.kth.se
            REACT_APP_IMAGE_SERVICE_URL=https://journal-image1.app.cloud.cbh.kth.se
            REACT_APP_SEARCH_SERVICE_URL=https://journal-search1.app.cloud.cbh.kth.se
            REACT_APP_KEYCLOAK_URL=https://journal-keycloak1.app.cloud.cbh.kth.se
            REACT_APP_KEYCLOAK_REALM=journal-realm
            REACT_APP_KEYCLOAK_CLIENT_ID=journal-frontend
