name: Lab3 CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lab3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-user-service:
    name: Build and test user-service
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Create databases
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS user_db;"
          mysql -h 127.0.0.1 -uroot -proot -e "SHOW DATABASES;"

      - name: Run tests
        working-directory: user-service
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn clean test

      - name: Build package
        working-directory: user-service
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn clean package -DskipTests

