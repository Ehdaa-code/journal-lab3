name: Lab3 CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lab3-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.cloud.cbh.kth.se/journal-lab3
  IMAGE_TAG: latest

jobs:
  build-and-test-user-service:
    name: Build and test user-service
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Create user_db
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS user_db;"

      - name: Run tests
        working-directory: user-service
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn clean test

  build-and-test-patient-service:
    name: Build and test patient-service
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Create patient_db
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS patient_db;"

      - name: Run tests
        working-directory: patient-service
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/patient_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn clean test

  build-and-test-message-service:
    name: Build and test message-service
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Create message_db
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS message_db;"

      - name: Run tests
        working-directory: message-service
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/message_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn clean test

  build-and-test-search-service:
    name: Build and test search-service
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Create patient_db
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS patient_db;"

      - name: Run tests
        working-directory: search-service
        env:
          QUARKUS_DATASOURCE_REACTIVE_URL: mysql://127.0.0.1:3306/patient_db
          QUARKUS_DATASOURCE_USERNAME: root
          QUARKUS_DATASOURCE_PASSWORD: root
        run: mvn clean test

  verify-image-service:
    name: Verify image-service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: image-service
        run: npm install

  verify-frontend:
    name: Verify frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_USER_SERVICE_URL: https://journal-user1.app.cloud.cbh.kth.se
          REACT_APP_PATIENT_SERVICE_URL: https://journal-patient1.app.cloud.cbh.kth.se
          REACT_APP_MESSAGE_SERVICE_URL: https://journal-message1.app.cloud.cbh.kth.se
          REACT_APP_IMAGE_SERVICE_URL: https://journal-image1.app.cloud.cbh.kth.se
          REACT_APP_SEARCH_SERVICE_URL: https://journal-search1.app.cloud.cbh.kth.se
          REACT_APP_KEYCLOAK_URL: https://journal-keycloak1.app.cloud.cbh.kth.se
          REACT_APP_KEYCLOAK_REALM: journal-realm
          REACT_APP_KEYCLOAK_CLIENT_ID: journal-frontend
        run: npm run build

  push-docker-images-to-cbhcloud:
    name: Push Docker images to cbhcloud
    runs-on: ubuntu-latest
    needs:
      - build-and-test-user-service
      - build-and-test-patient-service
      - build-and-test-message-service
      - build-and-test-search-service
      - verify-image-service
      - verify-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to cbhcloud registry
        uses: docker/login-action@v3
        with:
          registry: registry.cloud.cbh.kth.se
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push journal-user1
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: ${{ env.REGISTRY }}/journal-user1:${{ env.IMAGE_TAG }}

      - name: Build and push journal-patient1
        uses: docker/build-push-action@v5
        with:
          context: ./patient-service
          push: true
          tags: ${{ env.REGISTRY }}/journal-patient1:${{ env.IMAGE_TAG }}

      - name: Build and push journal-message1
        uses: docker/build-push-action@v5
        with:
          context: ./message-service
          push: true
          tags: ${{ env.REGISTRY }}/journal-message1:${{ env.IMAGE_TAG }}

      - name: Build and push journal-search1
        uses: docker/build-push-action@v5
        with:
          context: ./search-service
          push: true
          tags: ${{ env.REGISTRY }}/journal-search1:${{ env.IMAGE_TAG }}

      - name: Build and push journal-image1
        uses: docker/build-push-action@v5
        with:
          context: ./image-service
          push: true
          tags: ${{ env.REGISTRY }}/journal-image1:${{ env.IMAGE_TAG }}

      - name: Build and push journal-frontend2
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/journal-frontend2:${{ env.IMAGE_TAG }}
          build-args: |
            REACT_APP_USER_SERVICE_URL=https://journal-user1.app.cloud.cbh.kth.se
            REACT_APP_PATIENT_SERVICE_URL=https://journal-patient1.app.cloud.cbh.kth.se
            REACT_APP_MESSAGE_SERVICE_URL=https://journal-message1.app.cloud.cbh.kth.se
            REACT_APP_IMAGE_SERVICE_URL=https://journal-image1.app.cloud.cbh.kth.se
            REACT_APP_SEARCH_SERVICE_URL=https://journal-search1.app.cloud.cbh.kth.se
            REACT_APP_KEYCLOAK_URL=https://journal-keycloak1.app.cloud.cbh.kth.se
            REACT_APP_KEYCLOAK_REALM=journal-realm
            REACT_APP_KEYCLOAK_CLIENT_ID=journal-frontend
