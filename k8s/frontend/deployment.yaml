# frontend deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: journal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: registry.cloud.cbh.kth.se/deploy/journal-frontend2:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: REACT_APP_USER_SERVICE_URL
              value: https://journal-user1.app.cloud.cbh.kth.se
            - name: REACT_APP_PATIENT_SERVICE_URL
              value: https://journal-patient1.app.cloud.cbh.kth.se
            - name: REACT_APP_MESSAGE_SERVICE_URL
              value: https://journal-message1.app.cloud.cbh.kth.se
            - name: REACT_APP_IMAGE_SERVICE_URL
              value: https://journal-image1.app.cloud.cbh.kth.se
            - name: REACT_APP_SEARCH_SERVICE_URL
              value: https://journal-search1.app.cloud.cbh.kth.se
            - name: REACT_APP_KEYCLOAK_URL
              value: https://journal-keycloak1.app.cloud.cbh.kth.se
            - name: REACT_APP_KEYCLOAK_REALM
              value: journal-realm
            - name: REACT_APP_KEYCLOAK_CLIENT_ID
              value: journal-frontend
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10



