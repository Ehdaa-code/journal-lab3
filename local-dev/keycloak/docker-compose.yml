services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: journal-keycloak
    command: start-dev --http-port=8090 --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8090:8090"
    volumes:
      - ./journal-realm.json:/opt/keycloak/data/import/journal-realm.json:ro
